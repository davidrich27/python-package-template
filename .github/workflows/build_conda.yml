name: Build/Install via conda

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install build-essential git git-lfs

      - name: Install conda
        run: |
          curl -L https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh > Miniconda3-latest-Linux-x86_64.sh
          bash Miniconda3-latest-Linux-x86_64.sh -b -p ~/miniconda
          ~/miniconda/bin/conda update -n base -c defaults conda

      - name: Build conda environment
        run: |
          source ~/miniconda/etc/profile.d/conda.sh
          conda config --prepend channels conda-forge
          conda config --prepend channels bioconda
          conda config --show channels
          conda env create -f environment.yml
          conda activate larch-dev
          conda install -c conda-forge conda-build anaconda-client

      - name: Build package
        env:
          ANACONDA_USER: ${{ vars.ANACONDA_USER }}
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          ANACONDA_FLAGS: ${{ vars.ANACONDA_FLAGS }}
          UPLOAD_TO_ANACONDA_CLOUD: ${{ vars.UPLOAD_TO_ANACONDA_CLOUD }}
        run: |
          source ~/miniconda/etc/profile.d/conda.sh
          conda activate larch-dev
          export LARCH_VERSION=$(cat ./VERSION)
          export LARCH_INCLUDE_TEST=${LARCH_INCLUDE_TEST}
          export LARCH_RUN_TEST=${LARCH_RUN_TEST}
          if [[ ${UPLOAD_TO_ANACONDA_CLOUD} == true ]]; then
            conda build . --user ${ANACONDA_USER} --token ${ANACONDA_TOKEN} ${ANACONDA_FLAGS}
          else
            conda build .
          fi
