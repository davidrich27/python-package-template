name: Publish conda package to prefix.dev

on:
  push:
    branches: [ main ]
    tags:
        - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install build-essential git git-lfs

      - name: Install conda
        run: |
          curl -L https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh > Miniconda3-latest-Linux-x86_64.sh
          bash Miniconda3-latest-Linux-x86_64.sh -b -p ~/miniconda
          ~/miniconda/bin/conda update -n base -c defaults conda

      - name: Build conda environment
        run: |
          source ~/miniconda/etc/profile.d/conda.sh
          conda config --prepend channels conda-forge
          conda env create -f environment-dev.yml
          conda activate package_name
          conda install -c conda-forge conda-build pixi

      - name: Build package
        run: |
          source ~/miniconda/etc/profile.d/conda.sh
          conda activate package_name
          conda build --croot ../conda-bld .

      - name: Upload to Pixi
        env:
          PREFIXDEV_USER: ${{ vars.PREFIXDEV_USER }}
          PREFIXDEV_TOKEN: ${{ secrets.PREFIXDEV_TOKEN }}
        run: |
          source ~/miniconda/etc/profile.d/conda.sh
          conda activate package_name
          pixi auth login --token "$PREFIXDEV_TOKEN" "$PREFIXDEV_USER"
          pixi -v upload "$PREFIXDEV_USER" ../conda-bld/noarch/*.conda

