name: Publish conda package to Anaconda Cloud

on:
  push:
    branches: [ main ]  # Run on pushes to the main branch
  pull_request:
    branches: [ main ]  # Run on pull requests targeting the main branch
  workflow_dispatch:    # Allow manual triggering of the workflow

jobs:
  test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner
    strategy:
      matrix:
        python-version: ['3.11']  # Define Python version to use

    steps:
      - name: Check out code
        uses: actions/checkout@v3  # Fetch repository code, including submodules if needed
        with:
          submodules: true  # Ensure submodules are checked out (if applicable)

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2  # Use a dedicated action for Miniconda setup
        with:
          python-version: 3.11  # Match the Python version from the matrix
          channels: conda-forge,bioconda,defaults  # Prioritize these channels
          activate-environment: package_name  # Automatically activate this environment
          auto-update-conda: true  # Ensure conda is up-to-date

      - name: Create and configure conda environment
        run: |
          conda env create -f environment-dev.yml  # Create environment from YAML
          conda activate package_name  # Activate environment
          conda install -c conda-forge conda-build anaconda-client  # Install necessary tools

      - name: Build conda package
        run: |
          conda run -n package_name conda build --croot ../conda-bld .  # Use 'conda run' to avoid activation issues

      - name: Upload package to Anaconda Cloud
        env:
          ANACONDA_USER: ${{ vars.ANACONDA_USER }}  # Anaconda username from repo variables
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}  # Securely stored token for authentication
        run: |
          conda run -n package_name anaconda --token "$ANACONDA_TOKEN" upload --user "$ANACONDA_USER" ../conda-bld/noarch/*.conda --force

